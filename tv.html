<meta charset="utf-8">

<title>Tamil OTT</title>

<style>
*{box-sizing:border-box}html,body{height:100%;overflow:hidden}body{margin:0;background:#05070b;color:#fff;font-family:Arial,system-ui,sans-serif}
header{position:sticky;top:0;z-index:10;background:rgba(5,7,11,.97);padding:12px 18px;border-bottom:1px solid #202735}
.top{display:flex;align-items:center;gap:15px;flex-wrap:wrap}.logo{font-size:22px;font-weight:800;white-space:nowrap}.logo span{color:#1683ff}
.search{flex:1;min-width:220px}input{width:100%;padding:11px 16px;border-radius:22px;border:1px solid #293242;background:#121722;color:white;outline:none}
button{border:1px solid #2c3545;background:#151b25;color:#fff;border-radius:9px;padding:10px 13px;cursor:pointer}button:hover{background:#233047}
main{height:calc(100vh - 74px);max-width:1500px;margin:auto;padding:12px 18px 0;display:flex;flex-direction:column;overflow:hidden}
.player{background:#080a0e;border-radius:14px;overflow:hidden;box-shadow:0 8px 35px #0008}
video{width:100%;aspect-ratio:16/8.8;display:block;background:#000}
.info{padding:12px 15px;background:linear-gradient(#131925,#0b0e14)}.title{font-size:19px;font-weight:bold}.status{font-size:12px;color:#96a2b3;margin-top:4px}
.controls{display:flex;gap:8px;margin-top:9px}
h2{font-size:19px;margin:16px 0 10px;flex:0 0 auto}.count{color:#8793a5;font-size:12px;font-weight:normal}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;overflow-y:auto;overflow-x:hidden;min-height:0;flex:1;padding:2px 4px 20px 2px;align-content:start}
.card{background:#111722;border:1px solid #202938;border-radius:11px;padding:13px;min-height:78px;cursor:pointer}
.card:hover{background:#1b2534;transform:translateY(-1px)}.card.active{border:2px solid #1683ff;background:#17263a}
.name{font-size:14px;font-weight:bold;line-height:1.3}.type{font-size:11px;color:#8e9bad;margin-top:7px}
footer{display:none}
@media(max-width:1100px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:700px){main{height:calc(100vh - 112px);padding:8px}.grid{grid-template-columns:repeat(2,1fr);gap:8px}video{aspect-ratio:16/9}.top{gap:9px}}
</style>
</head>

<header><div class="top">

</section>
<h2>Live TV Channels <span class="count" id="count"></span></h2>
<div class="grid" id="grid"></div>
</main>
<footer>Tamil OTT • HLS & MPEG-DASH Web Player</footer>
